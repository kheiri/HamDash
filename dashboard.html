<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/4.1.17/framer-motion.cjs.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js" defer></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900" x-data="{ sidebarOpen: false }">
    <div class="flex h-screen bg-gray-200">
        <!-- Sidebar -->
        <div class="fixed inset-y-0 right-0 z-30 w-64 overflow-y-auto transition duration-300 ease-in-out transform translate-x-0 bg-gray-800"
            :class="{ 'translate-x-full': !sidebarOpen, 'translate-x-0': sidebarOpen }">
            <div class="flex items-center justify-center mt-8">
                <div class="flex items-center">
                    <span class="text-2xl font-semibold text-white">داشبورد</span>
                </div>
            </div>
            <nav class="mt-10">
                <a class="flex items-center px-6 py-2 mt-4 text-gray-100 bg-gray-700 bg-opacity-25" href="#">
                    <i class="w-6 h-6 fas fa-home"></i>
                    <span class="mx-3">داشبورد</span>
                </a>
                <a class="flex items-center px-6 py-2 mt-4 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                    href="#">
                    <i class="w-6 h-6 fas fa-chart-line"></i>
                    <span class="mx-3">فعالیت‌ها</span>
                </a>
                <a class="flex items-center px-6 py-2 mt-4 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                    href="#">
                    <i class="w-6 h-6 fas fa-wallet"></i>
                    <span class="mx-3">کیف پول الکترونیکی</span>
                </a>
                <div x-data="{ open: false }">
                    <a @click="open = !open"
                        class="flex items-center justify-between px-6 py-2 mt-4 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                        href="#">
                        <span class="flex items-center">
                            <i class="w-6 h-6 fas fa-money-bill-wave"></i>
                            <span class="mx-3">درآمد</span>
                        </span>
                        <span>
                            <i class="w-4 h-4 transition-transform duration-200 transform fas fa-chevron-down"
                                :class="{ 'rotate-180': open, 'rotate-0': !open }"></i>
                        </span>
                    </a>
                    <div x-show="open" class="mt-2 space-y-2">
                        <a class="flex items-center px-12 py-2 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                            href="#">شبکه من</a>
                        <a class="flex items-center px-12 py-2 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                            href="#">پروفایل</a>
                        <a class="flex items-center px-12 py-2 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                            href="#">مدیریت کارت‌ها</a>
                        <a class="flex items-center px-12 py-2 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                            href="#">اطلاعات ارتباطی</a>
                        <a class="flex items-center px-12 py-2 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                            href="#">ارتباط با ما</a>
                        <a class="flex items-center px-12 py-2 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                            href="#">راهنما</a>
                        <a class="flex items-center px-12 py-2 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                            href="#">مدیریت کاربران</a>
                        <a class="flex items-center px-12 py-2 text-gray-500 hover:bg-gray-700 hover:bg-opacity-25 hover:text-gray-100"
                            href="#">تنظیمات</a>
                    </div>
                </div>
            </nav>
        </div>

        <!-- Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="flex items-center justify-between px-6 py-4 bg-white border-b-4 border-indigo-600">
                <div class="flex items-center">
                    <button @click="sidebarOpen = !sidebarOpen" class="text-gray-500 focus:outline-none lg:hidden">
                        <i class="w-6 h-6 fas fa-bars"></i>
                    </button>
                    <div class="relative mx-4 lg:mx-0">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <i class="w-5 h-5 text-gray-500 fas fa-search"></i>
                        </span>

                        <input class="w-32 pl-10 pr-4 text-indigo-600 border-gray-200 rounded-md sm:w-64 focus:border-indigo-600 focus:ring focus:ring-opacity-40 focus:ring-indigo-500"
                            type="text" placeholder="جستجو">
                    </div>
                </div>

                <div class="flex items-center">
                    <div class="flex items-center mr-4">
                        <span class="text-sm font-medium">یکشنبه، ۶ مرداد ۱۴۰۴</span>
                    </div>
                    <button id="theme-toggle" class="px-4 py-2 mr-4 text-gray-700 bg-gray-200 rounded-md dark:bg-gray-700 dark:text-gray-200">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div x-data="{ dropdownOpen: false }" class="relative">
                        <button @click="dropdownOpen = !dropdownOpen"
                            class="relative block w-8 h-8 overflow-hidden rounded-full shadow focus:outline-none">
                            <img class="object-cover w-full h-full"
                                src="https://via.placeholder.com/40"
                                alt="Your avatar">
                        </button>

                        <div x-show="dropdownOpen" @click="dropdownOpen = false"
                            class="fixed inset-0 z-10 w-full h-full" style="display: none;"></div>

                        <div x-show="dropdownOpen"
                            class="absolute left-0 w-48 mt-2 overflow-hidden bg-white rounded-md shadow-xl z-10"
                            style="display: none;">
                            <a href="#"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-indigo-600 hover:text-white">پروفایل</a>
                            <a href="#"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-indigo-600 hover:text-white">محصولات</a>
                            <a href="#"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-indigo-600 hover:text-white">خروج</a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-200">
                <div class="container px-6 py-8 mx-auto">
                    <h3 class="text-3xl font-medium text-gray-700">داشبورد</h3>
                </div>
            </main>
        </div>
    </div>
    <script src="static/js/script.js"></script>
</body>
</html>
