<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ورود</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/4.1.17/framer-motion.cjs.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="gradient-bg flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-lg shadow-md">
        <div class="text-center">
            <img class="w-48 h-auto mx-auto" src="https://via.placeholder.com/200x60" alt="Logo">
            <h2 class="mt-6 text-2xl font-bold text-gray-900">
                ورود به حساب کاربری
            </h2>
        </div>
        <form class="mt-8 space-y-6" action="#" method="POST">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="email-address" class="sr-only">ایمیل یا نام کاربری</label>
                    <input id="email-address" name="email" type="email" autocomplete="email" required class="relative block w-full px-3 py-2 text-gray-900 placeholder-gray-500 border border-gray-300 rounded-none appearance-none rounded-t-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="ایمیل یا نام کاربری">
                </div>
                <div class="relative">
                    <label for="password" class="sr-only">رمز عبور</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="relative block w-full px-3 py-2 text-gray-900 placeholder-gray-500 border border-gray-300 rounded-none appearance-none rounded-b-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="رمز عبور">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3">
                        <i class="fa fa-eye-slash text-gray-400 cursor-pointer" id="toggle-password"></i>
                    </span>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <label for="remember-me" class="block mr-2 text-sm text-gray-900">
                        مرا به خاطر بسپار
                    </label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">
                        رمز عبور خود را فراموش کرده‌اید؟
                    </a>
                </div>
            </div>

            <div>
                <button type="submit" class="relative flex justify-center w-full px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md group hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    ورود
                </button>
            </div>
        </form>
        <div class="relative flex items-center justify-center w-full mt-6 border border-t">
            <div class="absolute px-3 bg-white">
                <span class="text-sm font-medium text-gray-500">
                    یا
                </span>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mt-6">
            <div>
                <a href="#" class="inline-flex justify-center w-full px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50">
                    <span class="sr-only">Sign in with Google</span>
                    <i class="fab fa-google"></i>
                </a>
            </div>
            <div>
                <a href="#" class="inline-flex justify-center w-full px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50">
                    <span class="sr-only">Sign in with GitHub</span>
                    <i class="fab fa-github"></i>
                </a>
            </div>
        </div>
        <div class="text-center">
            <p class="text-sm">
                حساب کاربری ندارید؟
                <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">
                    ثبت نام کنید
                </a>
            </p>
        </div>
        <div class="flex justify-center mt-6 space-x-4">
            <a href="#" class="text-gray-400 hover:text-gray-500">
                <span class="sr-only">WhatsApp</span>
                <i class="fab fa-whatsapp fa-2x"></i>
            </a>
            <a href="#" class="text-gray-400 hover:text-gray-500">
                <span class="sr-only">Telegram</span>
                <i class="fab fa-telegram fa-2x"></i>
            </a>
            <a href="#" class="text-gray-400 hover:text-gray-500">
                <span class="sr-only">Instagram</span>
                <i class="fab fa-instagram fa-2x"></i>
            </a>
        </div>
    </div>
    <script src="static/js/script.js"></script>
</body>
</html>
